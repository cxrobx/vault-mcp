[project]
name = "vault-mcp"
version = "0.1.0"
description = "Semantic search MCP server for a local markdown/Obsidian vault — local Ollama embeddings, SQLite + numpy vector store."
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.0,<2",
    "httpx>=0.27,<1",
    "numpy>=1.26",
    "pyyaml>=6.0",
]

[project.scripts]
vault-mcp = "vault_mcp.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
